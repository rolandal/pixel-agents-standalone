# ================================================================
#  Pixel Agents — inbound publish, LOCKED to Precision IT source IPs
#  ----------------------------------------------------------------
#  Origin : 10.69.69.69:3456  (this box, eno1) — plain HTTP, no app auth
#  Access : Cloudflare DNS-only (grey cloud). Only PIT public IPs can reach
#           the origin; the firewall source restriction is the access control.
#  Expand : source is a group — add more objects (or the Cloudflare ranges,
#           if you later flip to proxied + Cloudflare Access) when needed.
#
#  NOTE: a PIT-IP firewall lock and Cloudflare *proxied* mode are mutually
#  exclusive at the origin — proxied traffic arrives from Cloudflare's IPs,
#  not PIT's. This config assumes DNS-only (grey cloud) so PIT staff connect
#  direct to <WAN-IP>. That also means no edge TLS and no Cloudflare Access
#  in this mode; staff browse http://pixel.<domain>:3456.
#
#  Set: extip 144.6.218.21 -> mappedip 10.69.69.69:3456, extintf wan, dstintf lan2.
#  ---- STILL TO SET ----
#    <PIT-Public-Group> = the existing PIT source address group already on the box
#                         (confirm the exact object name)
#
#  Reply path: the box's default gateway must be the FortiGate's lan2 IP
#  on 10.69.69.0/24 (it is, given the box lives on 10.69.69.69/24).
# ================================================================

# --- 1. Custom service: the app's own port, direct (TCP/3456) --------------
config firewall service custom
    edit "Pixel-Agents-3456"
        set comment "Pixel Agents demo — direct HTTP to origin"
        set tcp-portrange 3456
    next
end

# --- 2. VIP / DNAT: 144.6.218.21:3456  ->  10.69.69.69:3456 ----------------
config firewall vip
    edit "VIP-PixelAgents"
        set comment "Publish Pixel Agents office demo (PIT-only, DNS-only)"
        set extip 144.6.218.21
        set extintf "wan"
        set portforward enable
        set protocol tcp
        set extport 3456
        set mappedip "10.69.69.69"
        set mappedport 3456
    next
end

# --- 3. Firewall policy: PIT -> Pixel Agents -------------------------------
#  Service matches the external port (3456). No security profiles / no SSL
#  inspection: inspection can strip the WebSocket 'Upgrade' header and kill
#  the live animation.
config firewall policy
    edit 0
        set name "PIT-in -> Pixel Agents"
        set srcintf "wan"
        set dstintf "lan2"
        set srcaddr "<PIT-Public-Group>"
        set dstaddr "VIP-PixelAgents"
        set action accept
        set schedule "always"
        set service "Pixel-Agents-3456"
        set logtraffic all
        set comments "Inbound Precision IT -> Pixel Agents office demo. Source locked to PIT public IPs. DNAT via VIP, no source NAT."
    next
end
